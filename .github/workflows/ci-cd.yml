name: Student Feedback CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Python syntax
        run: |
          python -m py_compile app.py

      - name: Test Flask application
        run: |
          python -c "from app import app; client = app.test_client(); response = client.get('/'); assert response.status_code == 200"

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Deployment stage
        run: echo "Deployment stage completed"